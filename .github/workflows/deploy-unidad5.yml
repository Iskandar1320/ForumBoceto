name: Publicar Unidad 5 (Vite)

on:
  push:
    branches: [main, master]
    paths:
      - 'Unidad5_0/**'
      - '.github/workflows/deploy-unidad5.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-unidad5
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    defaults:
      run:
        working-directory: Unidad5_0

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Generar sitio con Vite
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir archivos compilados
        uses: actions/upload-pages-artifact@v4
        with:
          path: Unidad5_0/dist

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
